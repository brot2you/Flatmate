<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182d52"><title>Flatmate Quest</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#183052;background:#eef4ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e6f3ff,#f9eaff);min-height:100vh}header{background:#192e55;color:white;padding:22px 16px;text-align:center}h1{margin:0;font-size:clamp(28px,5vw,42px)}header p{margin:6px}.wrap{max-width:850px;margin:auto;padding:18px}.nav{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:20px}button{cursor:pointer;border:0;border-radius:13px;padding:13px 18px;font:inherit;font-weight:750;background:#fff;color:#20365e;box-shadow:0 3px 0 #d1d9e9}button:focus-visible{outline:3px solid #ffae35}button.active,.primary{background:#ffca53;color:#273450}button:disabled{opacity:.5;cursor:default}.panel{background:#fff;border-radius:22px;padding:clamp(18px,4vw,32px);box-shadow:0 12px 30px #243b6820;min-height:320px}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;font-weight:700}.tag{display:inline-block;border-radius:100px;background:#eaf1ff;padding:7px 13px;font-size:13px;font-weight:800}.card{min-height:185px;background:#edf5ff;border:3px solid #b7d5ff;border-radius:22px;display:grid;place-items:center;text-align:center;padding:24px;margin:20px 0;cursor:pointer}.word{font-size:clamp(23px,5vw,35px);font-weight:850}.hint{color:#60718e;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}.choices button{text-align:left;border:2px solid #dce5f4;min-height:65px;box-shadow:none}.choices button.correct{background:#d8f8df;border-color:#37b76c}.choices button.wrong{background:#ffe0df;border-color:#e66c69}.feedback{min-height:48px;font-weight:700;padding:10px 0}.progress{height:12px;border-radius:20px;background:#e6ebf5;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#4cb8a7;transition:width .2s}input{font:inherit;width:100%;border:2px solid #cddaf0;border-radius:12px;padding:15px;margin:12px 0}footer{text-align:center;color:#66758e;padding:25px;font-size:13px}@media(max-width:520px){.choices{grid-template-columns:1fr}.nav button{flex:1 1 42%}.panel{min-height:350px}}</style></head><body><header><h1>🏠 FLATMATE QUEST</h1><p>Looking for a flatmate · English revision game</p></header><main class="wrap"><div class="stats"><span id="score">⭐ 0 points</span><span id="best">🏆 Record : 0</span></div><nav class="nav" aria-label="Activités"><button data-mode="cards">🃏 Flashcards</button><button data-mode="quiz">🎯 Quiz</button><button data-mode="translate">✍️ Traduction</button><button data-mode="challenge">🏆 Défi final</button></nav><section id="app" class="panel" aria-live="polite"></section></main><footer>FLATMATE QUEST · Révisions français ↔ anglais · Sauvegarde sur cet appareil</footer><script>
const vocab=[
['Flat','Appartement','easy'],['Flatmate','Colocataire','easy'],['Rent (noun)','Loyer','easy'],['An ad','Petite annonce','easy'],['Chores','Tâches ménagères','easy'],['The bills','Les factures','easy'],['Caring','Attentionné','easy'],['Nice / friendly','Sympathique / amical','easy'],['Helpful','Serviable','easy'],['Cheap','Bon marché','easy'],['Reasonable','Raisonnable','easy'],['Expensive','Cher','easy'],['Noisy','Bruyant','easy'],['Quiet','Calme / tranquille','easy'],['Do the housework','Faire le ménage','easy'],['Tidy the house','Ranger la maison','easy'],['Hoover the carpets','Passer l’aspirateur sur les tapis','easy'],['Sweep the floor','Balayer le sol','easy'],['Do the cooking','Faire la cuisine','easy'],['Do the washing up','Faire la vaisselle','easy'],['Do the shopping','Faire les courses','easy'],['Do the ironing','Faire le repassage','easy'],['Take the dustbin out','Sortir la poubelle','easy'],['Look for a flatmate','Rechercher un colocataire','easy'],['Share a flat','Partager un appartement','easy'],['Rent a flat','Louer un appartement','easy'],['Buy a flat','Acheter un appartement','easy'],['Sell a flat','Vendre un appartement','easy'],['Put an ad in the newspaper','Mettre une annonce dans le journal','easy'],["We're looking for a new flatmate.",'Nous recherchons un nouveau colocataire.','hard'],['What are you like?','Quelle est votre personnalité ?','hard'],['What do you do in your free time?','Que faites-vous pendant votre temps libre ?','hard'],['How often will I have to do the housework?','À quelle fréquence devrai-je faire le ménage ?','hard'],['How far is the nearest bus stop?','À quelle distance est l’arrêt de bus le plus proche ?','hard'],['How much is the rent?','Combien coûte le loyer ?','hard'],['Who does the cooking?','Qui fait la cuisine ?','hard'],['Who does the shopping?','Qui fait les courses ?','hard'],['How often do you organize parties?','À quelle fréquence organisez-vous des fêtes ?','hard'],['How many bathrooms are there?','Combien y a-t-il de salles de bains ?','hard'],['How many bedrooms are there?','Combien y a-t-il de chambres ?','hard']];
const $=s=>document.querySelector(s);let mode='cards',idx=0,flipped=false,score=Number(localStorage.fqScore||0),best=Number(localStorage.fqBest||0),deck=[],answered=false,correctCount=0;const shuffle=a=>[...a].sort(()=>Math.random()-.5);function save(){localStorage.fqScore=score;best=Math.max(best,score);localStorage.fqBest=best;$('#score').textContent='⭐ '+score+' points';$('#best').textContent='🏆 Record : '+best}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function start(m){mode=m;idx=0;flipped=false;answered=false;correctCount=0;deck=shuffle(m==='challenge'?vocab.filter(x=>x[2]==='hard'):vocab);document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));render()}function progress(){return `<span class="tag">${idx+1} / ${deck.length}</span><div class="progress"><div style="width:${idx/deck.length*100}%"></div></div>`}function next(){idx++;answered=false;flipped=false;if(idx>=deck.length){$('#app').innerHTML=`<h2>🎉 Bravo !</h2><p>Activité terminée. ${correctCount} bonnes réponses sur ${deck.length}.</p><div class="actions"><button class="primary" onclick="start(mode)">Rejouer 🔁</button><button onclick="start('cards')">Réviser les cartes</button></div>`;return}render()}function render(){let item=deck[idx];if(mode==='cards'){$('#app').innerHTML=`${progress()}<h2>🃏 Cartes de vocabulaire</h2><p>Appuie sur la carte pour découvrir la traduction.</p><div class="card" role="button" tabindex="0" onclick="flip()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flip()}"><div><div class="word">${esc(flipped?item[1]:item[0])}</div><p class="hint">${flipped?'Traduction française':'English · toucher pour retourner'}</p></div></div><div class="actions"><button onclick="flip()">🔄 Retourner</button><button class="primary" onclick="next()">Suivant →</button></div>`;return}if(mode==='quiz'){let opts=shuffle([item[1],...shuffle(vocab.filter(x=>x!==item&&x[1]!==item[1])).slice(0,3).map(x=>x[1])]);$('#app').innerHTML=`${progress()}<h2>🎯 Choisis la bonne traduction</h2><div class="card"><div class="word">${esc(item[0])}</div></div><div class="choices">${opts.map(o=>`<button onclick="choose(this,${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="actions"><button id="next" class="primary" onclick="next()" hidden>Suivant →</button></div>`;return}if(mode==='translate'||mode==='challenge'){$('#app').innerHTML=`${progress()}<h2>${mode==='challenge'?'🏆 Entretien de colocation':'✍️ Retrouve l’anglais'}</h2><p>${mode==='challenge'?'Traduis les questions utiles pour rencontrer un colocataire.':'Écris la traduction anglaise.'}</p><div class="card"><div class="word">${esc(item[1])}</div></div><form onsubmit="check(event)"><label for="answer">Ta réponse en anglais</label><input id="answer" autocomplete="off" spellcheck="false" required placeholder="Write in English..."><div class="actions"><button class="primary" type="submit">Vérifier ✓</button><button type="button" onclick="reveal()">Voir la réponse</button></div></form><div id="feedback" class="feedback"></div><div class="actions"><button id="next" class="primary" onclick="next()" hidden>Suivant →</button></div>`;return}}function flip(){flipped=!flipped;render()}function choose(b,v){if(answered)return;answered=true;let ok=v===deck[idx][1];if(ok){score+=10;correctCount++}save();document.querySelectorAll('.choices button').forEach(x=>{x.disabled=true;if(x.textContent===deck[idx][1])x.classList.add('correct')});if(!ok)b.classList.add('wrong');$('#feedback').textContent=ok?'✅ Correct ! +10 points':'💡 Bonne réponse : '+deck[idx][1];$('#next').hidden=false}function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}function check(e){e.preventDefault();if(answered)return;let v=$('#answer').value,answers=deck[idx][0].split(' / ');let ok=answers.some(a=>norm(a)===norm(v));answered=true;if(ok){score+=15;correctCount++}save();$('#feedback').textContent=ok?'✅ Excellent ! +15 points':'💡 Réponse attendue : '+deck[idx][0];$('#next').hidden=false;$('#answer').disabled=true}function reveal(){if(answered)return;answered=true;$('#feedback').textContent='💡 '+deck[idx][0];$('#next').hidden=false;$('#answer').disabled=true}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));save();start('cards');
</script></body></html>
